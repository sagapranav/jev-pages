<style>
  /* ============================== the tool around the page ============================== */
  :root {

    }
  }
  :root[data-theme="dark"] {

  .examples button:hover { color: var(--fg); text-decoration-color: currentColor; }

  .dline { margin: 0; font-size: 14px; line-height: 1.85; color: var(--muted); }

  #pop button:hover { background: color-mix(in oklab, var(--fg) 7%, transparent); } #pop button.on { font-weight: 650; }

  .foot .hud { font: 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace; }

  #frame.mobile { max-width: 400px; }

  #showcase, .homehead { display: none; }
  body.home { grid-template-columns: minmax(460px, 0.9fr) minmax(0, 1.1fr); }

  body.home .side { justify-content: center; padding: 40px 64px; }

  body.home .doc { margin: 0; gap: 22px; }

  .homehead h1 { margin: 0; font-size: 42px; line-height: 1.05; letter-spacing: -.045em; font-weight: 560; }

  .homehead p { margin: 12px 0 0; color: var(--muted); font-size: 15px; line-height: 1.55; max-width: 36ch; font-weight: 400; letter-spacing: -.005em; }
  /* the composer: a hairline gradient edge and a soft light behind it that wakes up as you type */

    background: linear-gradient(150deg, color-mix(in oklab, var(--accent) 60%, transparent), color-mix(in oklab, var(--fg) 9%, transparent) 32%, color-mix(in oklab, var(--fg) 5%, transparent) 68%, color-mix(in oklab, #ff8a5c 45%, transparent));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); opacity: .7; transition: opacity .4s; }

    filter: blur(52px); opacity: .5; transition: opacity .5s; animation: glowdrift 14s ease-in-out infinite alternate; }
  body.home .f:focus-within::before { opacity: 1; } body.home .f:focus-within::after { opacity: .8; }
  @keyframes glowdrift { from { transform: translate3d(-3%, -2%, 0) scale(1); } to { transform: translate3d(3%, 3%, 0) scale(1.06); } }
  @media (prefers-reduced-motion: reduce) { body.home .f::after { animation: none; } }
  body.home #brief { position: relative; z-index: 1; border: 0; border-radius: 18px; padding: 20px 22px 22px; font-size: 16.5px; line-height: 1.6; letter-spacing: -.008em; min-height: 136px; resize: none;
    background: linear-gradient(180deg, color-mix(in oklab, var(--field) 74%, transparent), color-mix(in oklab, var(--field) 88%, transparent)); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);

<style id="lpcss">
/* ============================== the landing page (.lp), styled only through preset tokens ============================== */
.lp { container: lp / inline-size; position: relative; background: var(--bg); color: var(--fg); font-family: var(--fb), system-ui, sans-serif; font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; overflow: hidden; text-align: left; }
.lp *, .lp *::before, .lp *::after { box-sizing: border-box; }
.lp a { color: inherit; text-decoration: none; }
.lp h1, .lp h2, .lp h3 { font-family: var(--fd), system-ui, sans-serif; font-weight: var(--dw); letter-spacing: var(--dt); line-height: 1.02; margin: 0; text-transform: var(--case); text-wrap: balance; }
.lp p { margin: 0; text-wrap: pretty; }
.lp .wrap { max-width: 1180px; margin: 0 auto; padding: 0 40px; position: relative; }
.lp .mono { font-family: var(--fm), ui-monospace, monospace; }
.lp .mu { color: var(--mu); }
.lp svg.ic { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* buttons */
.lp .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 46px; padding: 0 22px; border-radius: var(--br); font-weight: 560; font-size: 15px; font-family: var(--fb), sans-serif; white-space: nowrap; transition: transform .2s, box-shadow .2s, background .2s; border: 1px solid transparent; }
.lp .btn.sm { height: 36px; padding: 0 15px; font-size: 14px; }
.lp .btn.pri { background: var(--ac); color: var(--acfg); }
.lp .btn.sec { border-color: var(--line); color: var(--fg); background: color-mix(in oklab, var(--surf) 60%, transparent); }
.lp .btn:hover { transform: translateY(-1px); }
.lp[data-btn="brutal"] .btn { border: 2px solid var(--fg); box-shadow: 4px 4px 0 var(--fg); font-weight: 700; }
.lp[data-btn="brutal"] .btn.sec { background: var(--bg); }
.lp[data-btn="line"] .btn.pri { background: transparent; color: var(--ac); border-color: var(--ac); text-transform: uppercase; letter-spacing: .14em; font-size: 12.5px; font-weight: 500; }
.lp[data-btn="line"] .btn.sec { text-transform: uppercase; letter-spacing: .14em; font-size: 12.5px; font-weight: 500; border-color: transparent; }
.lp[data-btn="glow"] .btn.pri { box-shadow: 0 0 0 1px var(--ac), 0 0 28px -4px var(--ac); text-transform: uppercase; letter-spacing: .06em; font-size: 13.5px; }
.lp[data-btn="glow"] .btn.sec { text-transform: uppercase; letter-spacing: .06em; font-size: 13.5px; }

/* surfaces */
.lp .card { background: var(--surf); border: 1px solid var(--line); border-radius: var(--r); position: relative; overflow: hidden; }
.lp[data-card="glass"] .card { background: color-mix(in oklab, var(--surf2) 70%, transparent); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); box-shadow: inset 0 1px 0 rgba(255,255,255,.08); }
.lp[data-card="shadow"] .card { border-color: color-mix(in oklab, var(--line) 50%, transparent); box-shadow: 0 1px 2px rgba(10,10,30,.05), 0 18px 40px -18px rgba(10,10,40,.18); background: var(--surf2); }
.lp[data-card="brutal"] .card { border: 2px solid var(--fg); box-shadow: 6px 6px 0 var(--fg); border-radius: 0; background: var(--surf2); }
.lp[data-card="flat"] .card { border-color: transparent; }
.lp[data-card="rule"] .card { background: transparent; border: 0; border-top: 1px solid var(--line); border-radius: 0; }

/* emphasis on one headline word */
.lp[data-em="grad"] .emph { background: var(--g); -webkit-background-clip: text; background-clip: text; color: transparent; padding-right: .04em; }
.lp[data-em="serif"] .emph { font-family: var(--fs), Georgia, serif; font-style: italic; font-weight: 400; letter-spacing: -.01em; }
.lp[data-em="accent"] .emph { color: var(--ac); }
.lp[data-em="mark"] .emph { background: var(--ac); color: var(--acfg); padding: 0 .1em; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.lp[data-em="under"] .emph { text-decoration: underline; text-decoration-color: var(--ac2); text-decoration-thickness: .09em; text-underline-offset: .12em; }
.lp[data-em="fade"] .hero h1 { color: color-mix(in oklab, var(--fg) 45%, var(--bg)); }
.lp[data-em="fade"] .hero h1 .emph { color: var(--fg); }

/* nav */
.lp nav.top { display: flex; align-items: center; justify-content: space-between; height: 72px; position: relative; z-index: 3; }
.lp .logo { display: inline-flex; align-items: center; gap: 10px; font-family: var(--fd), sans-serif; font-weight: 650; font-size: 19px; letter-spacing: -.02em; }
.lp .logo svg { width: 24px; height: 24px; }
.lp .links { display: flex; gap: 30px; font-size: 14.5px; color: var(--mu); }
.lp .navr { display: flex; gap: 18px; align-items: center; font-size: 14.5px; }

/* hero */
.lp .hero { position: relative; isolation: isolate; overflow: clip; padding-bottom: 104px; }
.lp .bd { position: absolute; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
.lp .hin { padding-top: 64px; }
.lp .eb { display: inline-flex; align-items: center; gap: 10px; font-size: 13.5px; padding: 5px 14px 5px 6px; border: 1px solid var(--line); border-radius: 999px; background: color-mix(in oklab, var(--surf) 70%, transparent); color: var(--mu); margin-bottom: 28px; backdrop-filter: blur(8px); }
.lp .eb b { background: var(--ac); color: var(--acfg); font-weight: 600; font-size: 11.5px; padding: 2px 9px; border-radius: 999px; }
.lp[data-eb="text"] .eb { border: 0; background: none; padding: 0; text-transform: uppercase; letter-spacing: .22em; font-size: 12px; color: var(--ac); backdrop-filter: none; }
.lp[data-eb="text"] .eb b { display: none; }
.lp[data-eb="mono"] .eb { border: 0; background: none; padding: 0; font-family: var(--fm), monospace; font-size: 13px; color: var(--ac); backdrop-filter: none; }
.lp[data-eb="mono"] .eb b { background: none; color: var(--mu); padding: 0; font-weight: 400; font-size: 13px; }
.lp[data-eb="mono"] .eb b::before { content: "["; } .lp[data-eb="mono"] .eb b::after { content: "]"; }
.lp .hero h1 { font-size: clamp(40px, calc(6.3cqi * var(--hs)), 100px); }
.lp .hero .sub { font-size: clamp(17px, 1.6cqi, 21px); color: var(--mu); margin-top: 26px; max-width: 600px; line-height: 1.5; }
.lp .ctas { display: flex; gap: 12px; margin-top: 36px; flex-wrap: wrap; }
.lp .vis { margin-top: 72px; position: relative; }
.lp .hero[data-l="center"] .hin { display: flex; flex-direction: column; align-items: center; text-align: center; }
.lp .hero[data-l="center"] h1 { max-width: 15ch; }
.lp .hero[data-l="center"] .sub { margin-left: auto; margin-right: auto; }
.lp .hero[data-l="center"] .ctas { justify-content: center; }
.lp .hero[data-l="center"] .vis { width: 100%; perspective: 2200px; }
.lp .hero[data-l="center"] .vis > .frame { transform: rotateX(14deg); transform-origin: 50% 0; }
.lp .hero[data-l="split"] .hin { display: grid; grid-template-columns: 1fr 1.05fr; gap: 64px; align-items: center; padding-top: 72px; }
.lp .hero[data-l="split"] h1 { font-size: clamp(38px, calc(5cqi * var(--hs)), 76px); }
.lp .hero[data-l="split"] .vis { margin-top: 0; }
.lp .hero[data-l="editorial"] h1 { font-size: clamp(46px, calc(9cqi * var(--hs)), 150px); line-height: .95; max-width: 13ch; }
.lp .hero[data-l="editorial"] .row2 { display: grid; grid-template-columns: 1fr auto; gap: 40px; align-items: end; margin-top: 8px; }
.lp .hero[data-l="editorial"] .sub { max-width: 520px; }
.lp .hero[data-l="minimal"] .hin { min-height: 620px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding-top: 0; }
.lp .hero[data-l="minimal"] h1 { max-width: 14ch; font-size: clamp(44px, calc(7.4cqi * var(--hs)), 120px); }
.lp .hero[data-l="minimal"] .ctas { justify-content: center; }
.lp .hero[data-l="minimal"] .sub { margin-left: auto; margin-right: auto; }
.lp .hero[data-l="poster"] .hin { min-height: 700px; display: flex; flex-direction: column; justify-content: flex-end; padding-top: 0; }
.lp .hero[data-l="poster"] h1 { font-size: clamp(52px, calc(10.4cqi * var(--hs)), 172px); line-height: .9; max-width: 11ch; }
.lp .hero[data-l="poster"] .row2 { display: grid; grid-template-columns: 1fr auto; gap: 40px; align-items: end; border-top: 1px solid var(--line); margin-top: 36px; padding-top: 24px; }
.lp .hero[data-l="poster"] .sub, .lp .hero[data-l="editorial"] .sub { margin-top: 0; }
.lp .hero[data-l="poster"] .ctas, .lp .hero[data-l="editorial"] .ctas { margin-top: 0; }
.lp .anim > * { animation: lpup .9s cubic-bezier(.2,.8,.2,1) both; }
.lp .anim > *:nth-child(2) { animation-delay: .06s; } .lp .anim > *:nth-child(3) { animation-delay: .12s; } .lp .anim > *:nth-child(4) { animation-delay: .18s; } .lp .anim > *:nth-child(5) { animation-delay: .26s; }
@keyframes lpup { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

/* product mocks */
.lp .frame { border-radius: calc(var(--r) + 6px); border: 1px solid var(--line); background: var(--surf); overflow: hidden; position: relative; box-shadow: 0 50px 120px -50px color-mix(in oklab, var(--ac) 55%, transparent), 0 30px 60px -30px rgba(0,0,0,.35); text-align: left; }
.lp[data-card="brutal"] .frame { border: 2px solid var(--fg); box-shadow: 10px 10px 0 var(--fg); border-radius: 0; }
.lp .chrome { height: 38px; display: flex; align-items: center; gap: 7px; padding: 0 14px; border-bottom: 1px solid var(--line); background: var(--surf2); }
.lp .chrome i { width: 10px; height: 10px; border-radius: 50%; background: color-mix(in oklab, var(--fg) 18%, transparent); }
.lp .chrome .url { margin: 0 auto; font-size: 11.5px; color: var(--mu); padding: 3px 14px; border-radius: 6px; background: color-mix(in oklab, var(--fg) 6%, transparent); font-family: var(--fm), monospace; }
.lp .app { display: grid; grid-template-columns: 190px 1fr; min-height: 380px; font-size: 13px; }
.lp .app .side { border-right: 1px solid var(--line); padding: 14px 10px; display: grid; gap: 2px; align-content: start; background: color-mix(in oklab, var(--surf2) 50%, var(--surf)); }
.lp .app .side div { display: flex; gap: 9px; align-items: center; padding: 6px 8px; border-radius: 6px; color: var(--mu); }
.lp .app .side div.on { background: color-mix(in oklab, var(--fg) 7%, transparent); color: var(--fg); }
.lp .app .side div i { width: 12px; height: 12px; border-radius: 3px; border: 1.5px solid currentColor; opacity: .8; }
.lp .app .side .gap { height: 14px; }
.lp .app .main { padding: 16px 20px; }
.lp .app .mh { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.lp .app .mh b { font-size: 15px; font-weight: 600; }
.lp .app .mh span { font-size: 11.5px; padding: 4px 10px; border-radius: 6px; background: var(--ac); color: var(--acfg); }
.lp .app .row { display: grid; grid-template-columns: 16px 1fr auto auto; gap: 12px; align-items: center; padding: 10px 4px; border-bottom: 1px solid var(--line); }
.lp .app .row .ck { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--mu); }
.lp .app .row .ck.d { background: var(--ac); border-color: var(--ac); }
.lp .app .row .meta { color: var(--mu); font-size: 12px; font-family: var(--fm), monospace; }
.lp .app .row .st { font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--mu); }
.lp .app .row .st.a { color: var(--ac); border-color: color-mix(in oklab, var(--ac) 45%, transparent); background: color-mix(in oklab, var(--ac) 10%, transparent); }
.lp .code { font-family: var(--fm), ui-monospace, monospace; font-size: 13.5px; line-height: 1.75; background: color-mix(in oklab, var(--surf) 80%, var(--bg)); }
.lp .code .tabs { display: flex; border-bottom: 1px solid var(--line); background: var(--surf2); font-size: 12px; }
.lp .code .tabs span { padding: 10px 16px; color: var(--mu); border-right: 1px solid var(--line); }
.lp .code .tabs span.on { color: var(--fg); background: color-mix(in oklab, var(--surf) 80%, var(--bg)); box-shadow: inset 0 -2px 0 var(--ac); }
.lp .code pre { margin: 0; padding: 18px 0; overflow: hidden; }
.lp .code .l { display: grid; grid-template-columns: 44px 1fr; white-space: pre; }
.lp .code .l::before { content: attr(data-n); color: color-mix(in oklab, var(--mu) 55%, transparent); text-align: right; padding-right: 18px; }
.lp .code .k { color: var(--ac); } .lp .code .s { color: var(--ac2); } .lp .code .c { color: var(--mu); font-style: italic; } .lp .code .n { color: var(--ac2); }
.lp .term { background: #0b0b0d; color: #e6e6e6; font-family: var(--fm), ui-monospace, monospace; font-size: 13.5px; line-height: 1.8; }
.lp .term .chrome { background: #141417; border-color: rgba(255,255,255,.08); }
.lp .term .chrome i { background: rgba(255,255,255,.18); } .lp .term .chrome .url { color: #8a8a93; background: rgba(255,255,255,.06); }
.lp .term pre { margin: 0; padding: 18px 22px 22px; white-space: pre-wrap; }
.lp .term .p { color: var(--ac); } .lp .term .ok { color: #4ade80; } .lp .term .d { color: #8a8a93; }
.lp .term .cur { display: inline-block; width: 8px; height: 16px; background: #e6e6e6; vertical-align: -3px; animation: lpblink 1s steps(1) infinite; }
@keyframes lpblink { 50% { opacity: 0; } }
.lp .chart { padding: 22px 24px; display: grid; grid-template-columns: 1fr 200px; gap: 26px; }
.lp .chart .kpi { font-family: var(--fd), sans-serif; font-size: 38px; font-weight: var(--dw); letter-spacing: -.03em; line-height: 1.1; }
.lp .chart .lab { color: var(--mu); font-size: 13px; }
.lp .chart .dl { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: color-mix(in oklab, var(--ac) 14%, transparent); color: var(--ac); margin-left: 8px; vertical-align: 8px; font-family: var(--fb); letter-spacing: 0; }
.lp .chart svg.area { width: 100%; height: 190px; display: block; margin-top: 14px; overflow: visible; }
.lp .chart .bars { display: grid; gap: 14px; align-content: start; padding-top: 6px; font-size: 12.5px; }
.lp .chart .bars div span { display: flex; justify-content: space-between; color: var(--mu); margin-bottom: 5px; }
.lp .chart .bars div span b { color: var(--fg); font-weight: 560; }
.lp .chart .bars i { display: block; height: 6px; border-radius: 3px; background: color-mix(in oklab, var(--fg) 8%, transparent); overflow: hidden; }
.lp .chart .bars i em { display: block; height: 100%; background: var(--ac); border-radius: 3px; }
.lp .chat { padding: 22px; display: grid; gap: 14px; font-size: 14px; min-height: 360px; align-content: start; }
.lp .chat .m { max-width: 78%; padding: 11px 15px; border-radius: 16px; line-height: 1.5; }
.lp .chat .u { justify-self: end; background: var(--ac); color: var(--acfg); border-bottom-right-radius: 5px; }
.lp .chat .a { background: var(--surf2); border: 1px solid var(--line); border-bottom-left-radius: 5px; }
.lp .chat .t { font-size: 12px; color: var(--mu); display: flex; gap: 8px; align-items: center; font-family: var(--fm), monospace; }
.lp .chat .t i { width: 7px; height: 7px; border-radius: 50%; background: var(--ac); animation: lppulse 1.4s infinite; }
@keyframes lppulse { 50% { opacity: .25; } }
.lp .chat .in { margin-top: 6px; border: 1px solid var(--line); border-radius: 12px; padding: 11px 14px; color: var(--mu); display: flex; justify-content: space-between; background: var(--bg); }
.lp .chat .in b { width: 26px; height: 26px; border-radius: 8px; background: var(--ac); margin: -4px -6px -4px 0; }
.lp .phone { width: 300px; height: 600px; margin: 0 auto; border-radius: 46px; border: 10px solid color-mix(in oklab, var(--fg) 88%, var(--bg)); background: var(--bg); position: relative; overflow: hidden; box-shadow: 0 50px 100px -40px color-mix(in oklab, var(--ac) 55%, transparent), 0 30px 60px -30px rgba(0,0,0,.4); font-size: 13px; }
.lp .phone::before { content: ""; position: absolute; top: 9px; left: 50%; width: 90px; height: 26px; border-radius: 20px; background: color-mix(in oklab, var(--fg) 88%, var(--bg)); transform: translateX(-50%); z-index: 2; }
.lp .phone .scr { padding: 52px 18px 18px; display: grid; gap: 12px; }
.lp .phone .hd { display: flex; justify-content: space-between; align-items: center; }
.lp .phone .hd b { font-family: var(--fd), sans-serif; font-size: 22px; font-weight: var(--dw); letter-spacing: -.02em; }
.lp .phone .hd i { width: 30px; height: 30px; border-radius: 50%; background: var(--surf2); border: 1px solid var(--line); }
.lp .phone .big { border-radius: 20px; padding: 18px; background: var(--g); color: #fff; min-height: 150px; display: flex; flex-direction: column; justify-content: space-between; }
.lp .phone .big small { opacity: .85; } .lp .phone .big strong { font-size: 30px; font-family: var(--fd), sans-serif; letter-spacing: -.03em; line-height: 1; }
.lp .phone .it { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 14px; background: var(--surf); border: 1px solid var(--line); }
.lp .phone .it i { width: 34px; height: 34px; border-radius: 10px; background: color-mix(in oklab, var(--ac) 18%, transparent); display: grid; place-items: center; color: var(--ac); }
.lp .phone .it i svg { width: 17px; height: 17px; }
.lp .phone .it div { flex: 1; } .lp .phone .it small { display: block; color: var(--mu); font-size: 11.5px; }
.lp .fan { height: 420px; position: relative; }
.lp .fan .card { position: absolute; width: 300px; height: 360px; left: 50%; top: 30px; padding: 24px; display: flex; flex-direction: column; gap: 14px; }
.lp .fan .card:nth-child(1) { transform: translateX(-95%) rotate(-9deg); }
.lp .fan .card:nth-child(2) { transform: translateX(-50%) translateY(-18px); z-index: 2; }
.lp .fan .card:nth-child(3) { transform: translateX(-5%) rotate(9deg); }
.lp .fan .card .icb { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: color-mix(in oklab, var(--ac) 15%, transparent); color: var(--ac); }
.lp .fan .card h3 { font-size: 22px; }
.lp .fan .card .sk { height: 8px; border-radius: 4px; background: color-mix(in oklab, var(--fg) 8%, transparent); }
.lp .fan .card .sk.a { background: var(--g); width: 60%; margin-top: auto; height: 36px; border-radius: calc(var(--r) - 2px); }

/* sections */
.lp section.s { padding: 112px 0; position: relative; }
.lp[data-sep="line"] section.s { border-top: 1px solid var(--line); }
.lp .sh { max-width: 740px; margin: 0 auto 60px; text-align: center; }
.lp[data-align="left"] .sh { margin-left: 0; text-align: left; }
.lp .sh .k { font-size: 13px; color: var(--ac); font-weight: 560; margin-bottom: 14px; display: block; }
.lp[data-eb="text"] .sh .k { text-transform: uppercase; letter-spacing: .22em; font-size: 11.5px; }
.lp[data-eb="mono"] .sh .k { font-family: var(--fm), monospace; }
.lp .sh h2 { font-size: clamp(32px, calc(4.2cqi * var(--hs)), 58px); }
.lp .sh p { color: var(--mu); margin-top: 18px; font-size: 18px; }
.lp .logos { padding: 8px 0 26px; }
.lp .logos .t { text-align: center; color: var(--mu); font-size: 13.5px; margin-bottom: 26px; }
.lp .logos .row { display: flex; justify-content: center; align-items: center; gap: 22px 54px; flex-wrap: wrap; color: color-mix(in oklab, var(--fg) 62%, var(--bg)); }
.lp .logos .row span { display: inline-flex; align-items: center; gap: 8px; font-size: 21px; white-space: nowrap; }
.lp .logos .row svg { width: 22px; height: 22px; fill: currentColor; }
.lp .logos.marq .row { flex-wrap: nowrap; justify-content: flex-start; width: max-content; animation: lpmarq 36s linear infinite; }
.lp .logos.marq .clip { overflow: hidden; mask-image: linear-gradient(90deg, transparent, #000 15%, #000 85%, transparent); }
@keyframes lpmarq { to { transform: translateX(-50%); } }
.lp .icb { width: 40px; height: 40px; border-radius: calc(var(--r) * .7 + 2px); display: grid; place-items: center; color: var(--ac); background: color-mix(in oklab, var(--ac) 12%, transparent); border: 1px solid color-mix(in oklab, var(--ac) 22%, transparent); }
.lp h3 { text-transform: none; }
.lp .f h3 { font-size: 20px; letter-spacing: -.02em; line-height: 1.2; }
.lp .f p { color: var(--mu); margin-top: 8px; font-size: 15px; }
.lp .bento { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.lp .bento .card { padding: 28px; min-height: 250px; display: flex; flex-direction: column; justify-content: flex-end; gap: 4px; }
.lp .bento .card .icb { margin-bottom: auto; }
.lp .bento .w2 { grid-column: span 2; } .lp .bento .w3 { grid-column: span 3; min-height: 200px; }
.lp .bento .deco { position: absolute; right: 0; top: 0; width: 58%; height: 100%; pointer-events: none; mask-image: linear-gradient(90deg, transparent, #000 45%); }
.lp .bento .w2 .txt, .lp .bento .w3 .txt { max-width: 44%; }
.lp .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
.lp .grid3 .f { padding: 36px 32px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); display: grid; gap: 18px; align-content: start; }
.lp .grid3 .f .icb { background: none; border: 0; width: auto; height: auto; justify-content: start; }
.lp .rows { display: grid; gap: 110px; }
.lp .rows .r { display: grid; grid-template-columns: 1fr 1.15fr; gap: 72px; align-items: center; }
.lp .rows .r:nth-child(even) > :first-child { order: 2; }
.lp .rows .n { font-family: var(--fm), monospace; color: var(--ac); font-size: 13px; }
.lp .rows h3 { font-size: clamp(28px, 3.2cqi, 42px); margin-top: 12px; }
.lp .rows p { color: var(--mu); font-size: 17.5px; margin-top: 16px; max-width: 460px; }

/* --- filmstrip: vertical scroll moves sideways --- */

function jevRequest(B) {

    category: { type: 'choice', instructions: 'What kind of product does the brief describe?', criteria: crit(PACKS) },
    accent: { type: 'choice', instructions: 'Which accent color suits this product and its brand best?', criteria: crit(HUES) },
    narrative: { type: 'choice', instructions: 'Which page structure would persuade the buyers of this product best?', criteria: crit(NARRATIVES) },
    layout: { type: 'choice', instructions: 'Which hero layout suits this product? Physical products and brands often need no product view; software usually benefits from one.', criteria: LAYOUTS },
    visual: { type: 'choice', instructions: 'Which picture of the product should the top of the page show?', criteria: VISUALS },
    featLayout: { type: 'choice', instructions: 'How should the features section be laid out for this product?', criteria: FEATS },
    shape: { type: 'choice', instructions: 'If the page shows the physical product itself, which object is it closest to?', criteria: SHAPES },

    sMaterial: { type: 'choice', instructions: 'What should that object be made of, to feel right for this brand?', criteria: STUDIO_MATS },

      s = s.trim(); for (let i = 0; i < 4; i++) s = s.replace(lead, '');

      const w = s.split(/\s+/), n = w.length;

      if (/^(?:one|a|an|the)\s+\w+$/i.test(s)) continue;

    : /\b(coffee|espresso|tea|caf[eé]s?|bak\w+|bread|ramen|soup|kitchen|sauna|bath\w*|onsen|steam\w*|roast\w*)\b/.test(t) ? 'steam'

        const ahead = c.dir > 0 ? c.max - c.p : c.p, want = c.dir * (c.max / c.secs) * Math.min(1, 0.12 + ahead / 160) * DRIFT.slow;
        c.v = (c.v || 0) + (want - (c.v || 0)) * Math.min(1, dt * 1.6);                      // ease out of each turn, slow into each end
        c.p += c.v * dt;
        if (c.p >= c.max) { c.p = c.max; c.dir = -1; } else if (c.p <= 0) { c.p = 0; c.dir = 1; }
      } else c.v = 0;
      c.el.style.transform = `translate3d(0, ${(-c.p).toFixed(1)}px, 0)`;
    }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
  const nudge = (dy) => {
    if (!DRIFT.cols.some((c) => (dy > 0 ? c.p < c.max : c.p > 0))) return false;      // at the end: let the page scroll instead
    for (const c of DRIFT.cols) { c.p = Math.max(0, Math.min(c.max, c.p + dy)); c.dir = Math.sign(dy) || c.dir; }
    DRIFT.held = performance.now() + 1800; return true;
  };
  sc.addEventListener('wheel', (e) => { if (nudge(e.deltaMode === 1 ? e.deltaY * 32 : e.deltaY)) e.preventDefault(); }, { passive: false });
  let ty = null;
  sc.addEventListener('touchstart', (e) => { ty = e.touches[0].clientY; DRIFT.held = performance.now() + 1800; }, { passive: true });
  sc.addEventListener('touchmove', (e) => { if (ty == null) return; const y = e.touches[0].clientY; if (nudge(ty - y)) e.preventDefault(); ty = y; }, { passive: false });
  sc.addEventListener('touchend', () => { ty = null; });
  sc.addEventListener('mouseenter', () => { DRIFT.slow = 0.35; }); sc.addEventListener('mouseleave', () => { DRIFT.slow = 1; });
}
$('showcase').addEventListener('click', (e) => {
  const c = e.target.closest('.sccard'); if (!c) return;
  $('brief').value = SHOWCASE[+c.dataset.i][2]; setMode(); grow($('brief')); onInput(true);
});
addEventListener('resize', () => $('showcase').querySelectorAll('.scthumb > .lp').forEach((el) => { el.style.transform = `scale(${el.parentElement.clientWidth / 1280})`; }));
function setMode() {
  const home = !$('brief').value.trim(), was = document.body.classList.contains('home');
  document.body.classList.toggle('home', home);
  if (home) { enterEdit(false); buildShowcase(); }
  else if (was) requestAnimationFrame(() => { grow($('brief')); CANVASES.forEach((o) => drawCanvas(o, performance.now() / 1000)); });
}
$('brief').addEventListener('input', setMode);

(function init() {
  const fams = Object.values(FONTQ).map((q) => 'family=' + q);
  for (let i = 0; i < fams.length; i += 7) { const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = 'https://fonts.googleapis.com/css2?' + fams.slice(i, i + 7).join('&') + '&display=swap'; document.head.appendChild(l); }
  if (SHOT) document.documentElement.classList.add('shot');
  if (DEBUG) document.documentElement.classList.add('debug');
  $('brief').value = QS.has('text') ? QS.get('text') : QS.has('ex') ? EXAMPLES[+QS.get('ex')][1] : '';
  setMode(); if (document.body.classList.contains('home')) requestAnimationFrame(() => { $('brief').focus(); buildShowcase(); });
  requestAnimationFrame(() => grow($('brief')));
  for (const kv of (QS.get('lock') || '').split(',').filter(Boolean)) { const [k, v] = kv.split(':'); LOCK[k] = k === 'energy' ? +v : v === 'true' ? true : v === 'false' ? false : v; }
  relayReady.then(() => { onInput(true); if (QS.has('var')) setTimeout(() => $('bVar').click(), 400); });
  document.fonts?.ready.then(() => CANVASES.forEach((o) => drawCanvas(o, performance.now() / 1000)));
})();
</script>
